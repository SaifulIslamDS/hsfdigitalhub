name: Knowledge Hub Alignment CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate HSF Knowledge Hub
        run: python scripts/validate_hub.py

      - name: Validate Approved Social v4.0
        run: python scripts/validate_social_v4.py

      - name: Validate E4BL editorial series
        run: python scripts/validate_e4bl_series.py

      - name: Validate shared institutional headers
        run: python scripts/validate_shared_header.py

      - name: Validate unified 300-idea content library
        run: python scripts/validate_idea_library.py

      - name: Validate per-idea content prompt generator
        run: python scripts/validate_content_prompt_generator.py
