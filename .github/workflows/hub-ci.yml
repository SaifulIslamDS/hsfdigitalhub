name: Knowledge Hub Alignment CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate HSF Knowledge Hub
        run: python scripts/validate_hub.py

      - name: Validate Approved Social v4.0
        run: python scripts/validate_social_v4.py

      - name: Validate E4BL editorial series
        run: python scripts/validate_e4bl_series.py

      - name: Validate shared institutional headers
        run: python scripts/validate_shared_header.py

      - name: Validate unified 500-idea content library
        run: python scripts/validate_idea_library.py

      - name: Validate original 100 KDI concepts and evidence routes and originality evidence
        run: python scripts/validate_new_kdi_ideas.py

      - name: Validate original 100 PSC field-story routes and original 400-record integrity
        run: python scripts/validate_new_psc_ideas.py

      - name: Verify 200 user-reviewed editorial approvals and unchanged evidence gates
        run: python scripts/validate_editorial_approval_200.py

      - name: Validate per-idea content prompt generator
        run: python scripts/validate_content_prompt_generator.py

      - name: Validate internal HSF Design Studio integration
        run: python scripts/validate_design_studio.py

      - name: Validate HSF Design Studio Phase 1 canonical alignment
        run: python scripts/validate_design_studio_phase1.py

      - name: Validate institutional SSOT and controlled assets
        run: python scripts/validate_ssot_stability.py

      - name: Validate Brand Design Stack SVG structure
        run: python brand-design-stack/07_Engine/validate_stack.py
